<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小贴事</title><link rel="stylesheet" href="scene.css"><link rel="stylesheet" href="scene-overrides.css"></head>
<body><div class="scene">
  <div id="windowBar"><div class="window-controls"><button id="minimizeBtn" aria-label="最小化"></button><button id="maximizeBtn" aria-label="最大化"></button><button id="closeBtn" aria-label="关闭"></button></div></div>
  <nav id="nav"><button data-view="today" class="active" aria-label="今日任务"><span class="nav-text">☼　今日</span></button><button data-view="planned" aria-label="计划任务"><span class="nav-text">▣　计划</span></button><button data-view="all" aria-label="全部任务"><span class="nav-text">☷　全部</span></button><button data-view="done" aria-label="已完成任务"><span class="nav-text">✓　完成</span></button></nav>
  <div id="heading" aria-hidden="true"></div><div id="dateLabel"></div><button id="searchToggle" title="搜索任务" aria-label="搜索任务">⌕</button>
  <div id="searchWrap"><input id="search" type="search" placeholder="搜索任务或分类…" autocomplete="off"></div>
  <input id="newTitle" type="text" maxlength="140" placeholder="写下你想做的小事…" autocomplete="off">
  <button id="addBtn" aria-label="添加任务"></button>
  <button id="optionsToggle" aria-label="设置时间分类优先级" title="设置时间、分类和优先级"></button>
  <div id="options" class="hidden"><label>放在<select id="newList"><option value="today">今日</option><option value="planned">计划</option></select></label><label>提醒时间<input id="newDue" type="datetime-local"></label><label class="category-field">分类<div class="category-picker"><input id="newCategory" type="text" value="生活" autocomplete="off" aria-label="分类，可输入自定义分类" aria-haspopup="listbox" aria-expanded="false"><button type="button" class="category-toggle" aria-label="选择分类">⌄</button><div class="category-menu hidden" role="listbox"></div></div></label><label>优先级<select id="newPriority"><option>普通</option><option>重要</option><option>紧急</option></select></label></div>
  <div class="list-meta"><span id="listHeading"></span><span id="count"></span></div>
  <div id="tasks" class="task-list"></div>
  <div id="empty" class="empty hidden">这里还没有小事，写下第一件吧 ♡</div>
  <div id="menu" class="menu hidden"><button data-action="edit">编辑小事</button><button data-action="delete">删除小事</button></div>
  <div id="quickCategory" class="quick-popover hidden" role="dialog" aria-label="直接修改分类"><div class="quick-title">给这件小事换个分类 ♡</div><input id="quickCategoryInput" type="text" placeholder="搜索或输入自定义分类" autocomplete="off" aria-label="搜索或输入自定义分类"><div id="quickCategoryChoices" class="category-grid"></div><div class="quick-footer"><span>可直接输入自己的分类</span><button id="quickCategorySave" type="button">保存分类</button></div></div>
  <div id="quickPriority" class="quick-popover quick-priority hidden" role="dialog" aria-label="直接修改优先级"><div class="quick-title">调整优先级 ♡</div><div class="priority-choices"><button type="button" data-value="普通">普通 <small>慢慢做</small></button><button type="button" data-value="重要">重要 <small>记得做</small></button><button type="button" data-value="紧急">紧急 <small>先完成</small></button></div></div>
  <div id="quickDue" class="quick-popover quick-due hidden" role="dialog" aria-label="直接修改提醒时间"><div class="quick-title">这件小事，什么时候做？</div><input id="quickDueInput" type="datetime-local" aria-label="提醒时间"><div class="quick-actions"><button id="quickDueClear" type="button">清除时间</button><button id="quickDueSave" type="button">保存时间</button></div></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><h2>改一改这件小事</h2><label>这件小事<input id="editTitle" maxlength="140"></label><div class="modal-grid"><label>放在<select id="editList"><option value="today">今日</option><option value="planned">计划</option></select></label><label>提醒时间<input id="editDue" type="datetime-local"></label></div><div class="modal-grid"><label class="category-field">分类<div class="category-picker"><input id="editCategory" type="text" autocomplete="off" aria-label="分类，可输入自定义分类" aria-haspopup="listbox" aria-expanded="false"><button type="button" class="category-toggle" aria-label="选择分类">⌄</button><div class="category-menu hidden" role="listbox"></div></div></label><label>优先级<select id="editPriority"><option>普通</option><option>重要</option><option>紧急</option></select></label></div><button id="saveEdit">保存小事</button></div></div>
  <div id="deleteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deleteHeading" aria-describedby="deleteHint"><div class="modal-card delete-card"><span class="delete-flower" aria-hidden="true">✿</span><h2 id="deleteHeading">要删掉这件小事吗？</h2><p id="deleteTitle" class="delete-title"></p><p id="deleteHint" class="delete-hint">删掉后就找不回啦 ♡</p><div class="delete-actions"><button id="cancelDelete" type="button">先留着</button><button id="confirmDelete" type="button">删除小事</button></div></div></div>
</div><script src="app.js"></script></body></html>
